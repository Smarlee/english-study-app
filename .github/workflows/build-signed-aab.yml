name: Build Signed Android AAB

on:
  # 手动触发，需要输入签名密钥
  workflow_dispatch:
    inputs:
      version_name:
        description: '版本号 (如 1.0.0)'
        required: true
        default: '1.0.0'
      version_code:
        description: '版本代码 (整数，如 1)'
        required: true
        default: '1'

jobs:
  build-signed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            echo "Using npm ci..."
            npm ci
          else
            echo "Using npm install..."
            npm install
          fi

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install SDK components
        run: |
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      # 给 Gradle wrapper 添加执行权限（Linux/macOS 必需）
      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Sync Capacitor
        run: npx cap sync android

      # 从 GitHub Secrets 读取签名密钥
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore.jks

      # 更新版本号
      - name: Update version
        working-directory: ./android/app
        run: |
          sed -i "s/versionCode .*/versionCode ${{ github.event.inputs.version_code }}/" build.gradle
          sed -i "s/versionName .*/versionName \"${{ github.event.inputs.version_name }}\"/" build.gradle

      # 配置签名并构建 AAB
      - name: Build Signed AAB
        working-directory: ./android
        run: ./gradlew bundleRelease --stacktrace
        env:
          KEYSTORE_PATH: keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # 配置签名并构建 APK
      - name: Build Signed APK
        working-directory: ./android
        run: ./gradlew assembleRelease --stacktrace
        env:
          KEYSTORE_PATH: keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # 上传签名后的包
      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: signed-aab-v${{ github.event.inputs.version_name }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 90

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: signed-apk-v${{ github.event.inputs.version_name }}
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90

      # 创建 GitHub Release
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.event.inputs.version_name }}
          name: Release v${{ github.event.inputs.version_name }}
          files: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}