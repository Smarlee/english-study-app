name: Build Android AAB

on:
  # 手动触发
  workflow_dispatch:
    inputs:
      version_name:
        description: '版本号 (如 1.0.0)'
        required: true
        default: '1.0.0'
      version_code:
        description: '版本代码 (整数，如 1)'
        required: true
        default: '1'

  # 推送到 main 分支时自动触发
  push:
    branches: [main, master]
    paths:
      - 'www/**'
      - 'android/**'
      - '.github/workflows/**'

  # PR 时触发构建验证（不上传）
  pull_request:
    branches: [main, master]

jobs:
  build-aab:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 设置 Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. 调试：检查文件结构
      - name: Debug - Check files
        run: |
          echo "=== Current Directory ==="
          pwd
          ls -la
          echo "=== package.json exists? ==="
          test -f package.json && echo "YES" || echo "NO"
          echo "=== package-lock.json exists? ==="
          test -f package-lock.json && echo "YES" || echo "NO"
          echo "=== android/gradlew exists? ==="
          test -f android/gradlew && echo "YES" || echo "NO"
          echo "=== www/ exists? ==="
          test -d www && echo "YES" || echo "NO"

      # 4. 安装依赖（使用 npm install 作为后备）
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            echo "Using npm ci..."
            npm ci
          else
            echo "Using npm install..."
            npm install
          fi

      # 5. 设置 JDK 17
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 6. 设置 Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 7. 接受 Android SDK 许可
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      # 8. 安装必要的 SDK 组件（与项目配置匹配：compileSdkVersion = 35）
      - name: Install SDK components
        run: |
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      # 9. 给 Gradle wrapper 添加执行权限（Linux/macOS 必需）
      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      # 10. 同步 Capacitor
      - name: Sync Capacitor
        run: npx cap sync android

      # 11. 更新版本号 (手动触发时)
      - name: Update version
        if: github.event_name == 'workflow_dispatch'
        working-directory: ./android/app
        run: |
          sed -i "s/versionCode .*/versionCode ${{ github.event.inputs.version_code }}/" build.gradle
          sed -i "s/versionName .*/versionName \"${{ github.event.inputs.version_name }}\"/" build.gradle

      # 12. 构建 Debug APK (用于测试)
      - name: Build Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug --stacktrace

      # 13. 构建 Release AAB (未签名，用于 Google Play 你自己签名)
      - name: Build Release AAB
        working-directory: ./android
        run: ./gradlew bundleRelease --stacktrace

      # 14. 上传 Debug APK 到 Artifact
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # 15. 上传 Release AAB 到 Artifact
      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 90

      # 16. 上传到 GitHub Release (仅手动触发时)
      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.event.inputs.version_name }}
          name: Release v${{ github.event.inputs.version_name }}
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}